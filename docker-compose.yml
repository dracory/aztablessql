services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: aztablessql-azurite-test
    command: azurite-table --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
    ports:
      - "10000:10000" # blob
      - "10001:10001" # queue
      - "10002:10002" # table
    healthcheck:
      # Azurite does not ship a shell ping; use the Table service REST endpoint.
      # A GET on /TableStorage returns 400 with a stable body once the service is up.
      test:
        [
          "CMD",
          "node",
          "-e",
          "const http=require('http');const r=http.request({host:'127.0.0.1',port:10002,path:'/TableStorage',method:'GET',timeout:2000},res=>{process.exit(res.statusCode?0:1)});r.on('error',()=>process.exit(1));r.end();",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
